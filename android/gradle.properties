# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use Android Studio bundled JBR for Gradle JVM
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# If you prefer to build with Adoptium Temurin JDK 17 (recommended), install it
# and set `org.gradle.java.home` to the JDK installation path below (uncomment
# and update to your actual path). Example Windows path:
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.17.10-hotspot
#
# Alternatively set the system `JAVA_HOME` (Environment Variables) and remove
# this override so Gradle uses the system JDK. To set JAVA_HOME from an
# elevated PowerShell prompt run (adjust path to your JDK):
#
#   setx -m JAVA_HOME "C:\Program Files\Eclipse Adoptium\jdk-17.0.21.1-hotspot"
#
# Then restart Android Studio/terminal and verify with:
#   java -version
#   gradlew.bat -v
android.suppressUnsupportedCompileSdk=35

# Release signing properties for generating a signed AAB for Play Internal Testing.
# NOTE: These are development/test values. Replace the keystore and passwords with
# your production key and keep it secure. The keystore will be created at
# android/keystore/impostorz-release.jks by the build helper below.
RELEASE_STORE_FILE=keystore/impostorz-release.jks
RELEASE_STORE_PASSWORD=impostorz_sign_pass
RELEASE_KEY_ALIAS=impostorz_key
RELEASE_KEY_PASSWORD=impostorz_sign_pass
