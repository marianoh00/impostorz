
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impostorz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-cyan: #22d3ee;
        --neon-blue: #0ea5e9;
        --deep-slate: #020617;
        --glass-bg: rgba(15, 23, 42, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --gold-premium: #eab308;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--deep-slate);
        color: #f8fafc;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .font-bungee {
        font-family: 'Bungee', cursive;
      }
      
      /* Premium Background Layer */
      .bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
      }

      .bg-glow {
        position: absolute;
        width: 60vw;
        height: 60vw;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.08) 0%, transparent 70%);
        filter: blur(100px);
        pointer-events: none;
        z-index: -1;
      }

      .glow-1 { top: -10%; right: -10%; animation: drift 15s infinite alternate ease-in-out; }
      .glow-2 { bottom: -10%; left: -10%; animation: drift 20s infinite alternate-reverse ease-in-out; }

      @keyframes drift {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(50px, 50px) scale(1.1); }
      }

      /* Refined Glassmorphism */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .glass-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
        pointer-events: none;
      }

      .neon-glow-text { 
        text-shadow: 0 0 20px rgba(34, 211, 238, 0.4); 
      }
      
      .holographic {
        position: relative;
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
      }
      
      .btn-primary {
        background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-blue) 100%);
        box-shadow: 0 10px 25px -5px rgba(34, 211, 238, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(34, 211, 238, 0.5);
        filter: brightness(1.1);
      }
      .btn-primary:active {
        transform: translateY(1px);
      }

      /* Premium Legend Styling */
      .premium-legend-btn {
        background: linear-gradient(135deg, rgba(234, 179, 8, 0.15) 0%, rgba(234, 179, 8, 0.05) 100%);
        border: 1px solid rgba(234, 179, 8, 0.4);
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }
      
      .premium-legend-btn:hover {
        background: rgba(234, 179, 8, 0.2);
        border-color: rgba(234, 179, 8, 0.6);
        transform: scale(1.02);
      }

      .premium-legend-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% { left: -150%; }
        100% { left: 150%; }
      }

      .spark-icon {
        animation: spark 2s infinite ease-in-out;
        display: inline-block;
      }

      @keyframes spark {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 5px var(--gold-premium)); }
      }

      .step-active {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .floating { animation: float 6s ease-in-out infinite; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }

      /* Scanning effect for reveals */
      .scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        top: 0;
        left: 0;
        animation: scan 3s linear infinite;
        opacity: 0.5;
        z-index: 10;
        pointer-events: none;
      }

      @keyframes scan {
        0% { top: 0%; }
        100% { top: 100%; }
      }
      /* Modal helpers: keep overlays fixed, responsive, and disallow horizontal panning */
      .modal-overlay {
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
        /* default overlay uses padding to respect safe areas; ad overlay will override inline */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 16px);
      }
      .modal-content {
        max-width: 95vw;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        touch-action: pan-y;
        margin: 0 auto; /* ensure horizontal centering when limits apply */
      }
      /* Helper to ensure the overlay's grid centers the modal reliably.
         Use a static child so centering is computed by the overlay (avoid nested fixed offsets). */
      .modal-center {
        position: static !important;
        left: auto !important;
        top: auto !important;
        transform: none !important;
        margin: 0 auto !important;
        touch-action: none !important;
        -webkit-user-select: none !important;
      }
      /* Ad-specific fixed centering: force exact viewport centering for critical small dialogs */
      .ad-modal-fixed {
        position: fixed !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
        width: min(95vw, 560px) !important;
        max-width: 95vw !important;
        touch-action: none !important;
        -webkit-user-select: none !important;
      }
      /* App root should fill the viewport on any device */
      .app-root {
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        margin: 0;
        padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 16px);
        box-sizing: border-box;
        overflow-x: hidden;
      }
      /* Enforce full-viewport layout and block horizontal pan/drags globally */
      html, body, #root, .app-root {
        width: 100%;
        height: 100%;
        max-width: 100%;
        overflow-x: hidden !important;
        touch-action: pan-y !important; /* allow vertical scrolling only */
        -webkit-user-drag: none !important;
        user-select: none !important;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none !important;
        overscroll-behavior-x: none !important;
      }
    </style>
    <script type="importmap">
{
  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

  }

</script>

</head>
  <body>
    <div class="bg-canvas"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
